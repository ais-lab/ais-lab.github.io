name: on-pull-request
run-name: on pull request activity

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: write
  pull-requests: write

jobs:
  update-citations:
    # skip fork PRs: checking out fork code under pull_request_target is unsafe
    # (citations are updated by on-push after merge instead)
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/update-citations.yaml

  # build-preview:
